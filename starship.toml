"$schema" = 'https://starship.rs/config-schema.json'

# Cores do preset gruvbox-rainbow do starship (hex direto, sem palette)
format = """
[](#D65D0E)\
$os\
$username\
[](bg:#D79921 fg:#D65D0E)\
$directory\
[](fg:#D79921 bg:#689D6A)\
$git_branch\
$git_status\
[](fg:#689D6A bg:#3C3836)\
$time\
[ ](fg:#3C3836)\
"""

# Disable the blank line at the start of the prompt
# add_newline = false

[username]
show_always = true
style_user = "bg:#D65D0E fg:#FBF1C7"
style_root = "bg:#D65D0E fg:#FBF1C7"
format = '[ $user ]($style)'

[os]
style = "bg:#D65D0E fg:#FBF1C7"
disabled = true # Disabled by default

[directory]
style = "fg:#FBF1C7 bg:#D79921"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#689D6A"
format = '[[ $symbol $branch ](fg:#FBF1C7 bg:#689D6A)]($style)'

[git_status]
style = "bg:#689D6A"
format = '[[($all_status$ahead_behind )](fg:#FBF1C7 bg:#689D6A)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:#3C3836"
format = '[[  $time ](fg:#FBF1C7 bg:#3C3836)]($style)'

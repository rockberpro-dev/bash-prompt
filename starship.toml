"$schema" = 'https://starship.rs/config-schema.json'

# Monokai Soda: baseado no preset pastel-powerline do starship
# rosa #F4005F, laranja #FA8419, amarelo #E0D561, roxo #9D65FF

format = """
[](#F4005F)\
$os\
$username\
[](bg:#FA8419 fg:#F4005F)\
$directory\
[](fg:#FA8419 bg:#E0D561)\
$git_branch\
$git_status\
[](fg:#E0D561 bg:#9D65FF)\
$time\
[ ](fg:#9D65FF)\
"""

# Disable the blank line at the start of the prompt
# add_newline = false

# You can also replace your username with a neat symbol like   or disable this
# and use the os module below
[username]
show_always = true
style_user = "fg:#1A1A1A bg:#F4005F"
style_root = "fg:#1A1A1A bg:#F4005F"
format = '[$user ]($style)'
disabled = false

# An alternative to the username module which displays a symbol that
# represents the current operating system
[os]
style = "fg:#1A1A1A bg:#F4005F"
disabled = true # Disabled by default

[directory]
style = "fg:#1A1A1A bg:#FA8419"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

# Here is how you can shorten some long paths by text replacement
# similar to mapped_locations in Oh My Posh:
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
# Keep in mind that the order matters. For example:
# "Important Documents" = " 󰈙 "
# will not be replaced, because "Documents" was already substituted before.
# So either put "Important Documents" before "Documents" or use the substituted version:
# "Important 󰈙 " = " 󰈙 "

[git_branch]
symbol = ""
style = "fg:#1A1A1A bg:#E0D561"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "fg:#1A1A1A bg:#E0D561"
format = '[$all_status$ahead_behind ]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "fg:#1A1A1A bg:#9D65FF"
format = '[ 󰥔 $time ]($style)'
